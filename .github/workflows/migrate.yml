name: Migrate

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip without a database
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL secret is not set; no migrations applied."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.DATABASE_URL != ''

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.DATABASE_URL != ''
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: env.DATABASE_URL != ''
        run: npm ci

      - name: Apply migrations
        if: env.DATABASE_URL != ''
        run: npm run db:migrate
